[package]
name = "ocrs-capi"
version = "0.12.2"
edition = "2021"
authors = ["Robert Knight"]
description = "C ABI for the ocrs OCR engine"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/robertknight/ocrs"
repository = "https://github.com/robertknight/ocrs"
publish = false

[dependencies]
ocrs = { path = "../ocrs", version = "0.12.2", default-features = false, features = ["rten"] }
rten = { workspace = true }
rten-imageproc = { workspace = true }

[features]
default = []
# Support loading custom models in ONNX format
onnx = ["ocrs/onnx"]

[lib]
name = "ocrs_capi"
crate-type = ["cdylib", "staticlib"]
