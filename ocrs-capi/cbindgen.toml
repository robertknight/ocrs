language = "C"
header = """/*
 * C ABI for the ocrs OCR engine.
 *
 * This file is generated by cbindgen from the Rust source. Do not edit it by
 * hand. Run `just capi-header` after changing the API.
 *
 * See README.md for build, linking, and usage instructions.
 */"""
include_guard = "OCRS_H"
pragma_once = false
cpp_compat = true
tab_width = 2
documentation = true
documentation_style = "c99"
usize_is_size_t = true


[parse]
parse_deps = false
